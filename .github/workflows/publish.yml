name: 同步、翻译并发布

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  translate:
    name: 翻译 ${{ matrix.batch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        batch:
          - __root__
          - build
          - contribute
          - develop
          - hardware
          - introduction
          - kernel
          - project
          - releases
          - safety
          - security
          - services
    steps:
      - name: Checkout translation project
        uses: actions/checkout@v4
      - name: Checkout Zephyr source
        uses: actions/checkout@v4
        with:
          repository: zephyrproject-rtos/zephyr
          ref: main
          path: upstream
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install translation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-translate.txt
      - name: Restore translation cache and model
        uses: actions/cache@v4
        with:
          path: |
            .cache
            ~/.cache/argos-translate
            ~/.local/share/argos-translate
          key: translation-cache-argos-${{ matrix.batch }}-${{ hashFiles('upstream/doc/**/*.rst', 'upstream/doc/**/*.md') }}
          restore-keys: |
            translation-cache-argos-${{ matrix.batch }}-
      - name: Translate batch
        run: >-
          python tools/translate_rst.py
          --tree upstream/doc
          --batch "${{ matrix.batch }}"
          --cache ".cache/${{ matrix.batch }}.json"
          --output translated
      - name: Upload translated batch
        uses: actions/upload-artifact@v4
        with:
          name: translated-${{ matrix.batch }}
          path: translated
          if-no-files-found: error

  build:
    needs: translate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translation project
        uses: actions/checkout@v4
      - name: Checkout Zephyr source
        uses: actions/checkout@v4
        with:
          repository: zephyrproject-rtos/zephyr
          ref: main
          path: upstream
          fetch-depth: 1
      - name: Download translated batches
        uses: actions/download-artifact@v4
        with:
          pattern: translated-*
          path: translated-parts
          merge-multiple: true
      - name: Overlay translated files
        run: cp -a translated-parts/. upstream/doc/
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install translation and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-translate.txt
          python -m pip install -r upstream/doc/requirements.txt
      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: |
            .cache
            ~/.cache/argos-translate
            ~/.local/share/argos-translate
          key: translation-cache-argos-${{ hashFiles('upstream/doc/**/*.rst', 'upstream/doc/**/*.md') }}
          restore-keys: |
            translation-cache-argos-
      - name: Translate RST and Markdown sources
        run: python tools/translate_rst.py --tree upstream/doc --cache .cache/translation.json
      - name: Build HTML
        working-directory: upstream/doc
        run: make html SPHINXOPTS="-j 2 -T --keep-going"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: upstream/doc/_build/html
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
